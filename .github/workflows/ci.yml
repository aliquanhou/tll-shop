name: TLL Shop CI

on:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  # === 固定 TLL OS Toolchain（禁止随 develop 漂移）===
  TLLOS_REPO: aliquanhou/tllos
  TLLOS_REF: 687540179c0a5636930ee2516fb1fa0e5b2eb31c
  TLLOS_COMMIT: 6875401
  TLLC_PATH: tools/TLLC/tllc.tllbc
  # Compiler SHA256 (tllc-v1.0.0-rc1, source commit 364b9c5)
  COMPILER_SHA256: 36A5A20EB1124D2F40ED0051357D06DD976E488489DF61D652140FEFC556A845
  # Bootstrap/Rescue Compiler SHA256
  BOOTSTRAP_COMPILER_SHA256: 38825F1487D713B70793049427809F5D376F3586870C38D6CE008D07AED23677

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout TLL Shop
        uses: actions/checkout@v4

      - name: Checkout TLL OS (fixed toolchain)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TLLOS_REPO }}
          ref: ${{ env.TLLOS_REF }}
          path: tllos

      - name: Verify TLL OS commit
        shell: bash
        run: |
          echo "=== Verifying TLL OS Toolchain ==="
          if [ ! -d "tllos" ]; then
            echo "❌ FAIL: tllos directory not found"
            exit 1
          fi
          cd tllos
          ACTUAL_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          echo "Expected commit: ${{ env.TLLOS_COMMIT }}"
          echo "Actual commit:   $ACTUAL_COMMIT"
          if [ "$ACTUAL_COMMIT" != "${{ env.TLLOS_COMMIT }}" ]; then
            echo "❌ FAIL: TLL OS commit mismatch!"
            exit 1
          fi
          echo "✅ TLL OS commit verified: $ACTUAL_COMMIT"

      - name: Verify Compiler SHA256
        shell: bash
        run: |
          echo "=== Verifying Compiler SHA256 ==="
          TLLC="tllos/${{ env.TLLC_PATH }}"
          if [ ! -f "$TLLC" ]; then
            echo "❌ FAIL: Compiler not found at $TLLC"
            exit 1
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            ACTUAL_SHA=$(powershell -Command "(Get-FileHash '$TLLC' -Algorithm SHA256).Hash.ToUpper()")
          else
            ACTUAL_SHA=$(sha256sum "$TLLC" | awk '{print $1}' | tr '[:lower:]' '[:upper:]')
          fi
          echo "Expected SHA256: ${{ env.COMPILER_SHA256 }}"
          echo "Actual SHA256:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "${{ env.COMPILER_SHA256 }}" ]; then
            echo "❌ FAIL: Compiler SHA256 mismatch!"
            exit 1
          fi
          echo "✅ Compiler SHA256 verified"
          echo "Compiler size: $(wc -c < "$TLLC") bytes"

      - name: Setup build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libssl-dev

      - name: Setup build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc || true

      - name: Build TLL Runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "=== Building TLL Runtime (Linux) ==="
          cd tllos/host/c
          echo "Source files:"
          ls *.c
          gcc -O2 -std=gnu99 -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
            -o tllvm \
            main.c vm.c value.c json.c builtin.c \
            sqlite_builtin.c crypto_builtin.c password_builtin.c \
            hmac_builtin.c http_client_builtin.c sqlite3.c \
            -lm -lpthread -ldl -lssl -lcrypto
          BUILD_RESULT=$?
          echo "gcc exit code: $BUILD_RESULT"
          if [ $BUILD_RESULT -ne 0 ] || [ ! -f tllvm ]; then
            echo "❌ FAIL: tllvm build failed"
            exit 1
          fi
          echo "✅ tllvm built successfully"
          ls -la tllvm
          ./tllvm --version 2>/dev/null || true

      - name: Build TLL Runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "=== Building TLL Runtime (macOS) ==="
          cd tllos/host/c
          echo "Source files:"
          ls *.c
          gcc -O2 -std=gnu99 -D_DARWIN_C_SOURCE \
            -o tllvm \
            main.c vm.c value.c json.c builtin.c \
            sqlite_builtin.c crypto_builtin.c password_builtin.c \
            hmac_builtin.c http_client_builtin.c sqlite3.c \
            -lm -lpthread -framework Security -framework CoreFoundation
          BUILD_RESULT=$?
          echo "gcc exit code: $BUILD_RESULT"
          if [ $BUILD_RESULT -ne 0 ] || [ ! -f tllvm ]; then
            echo "❌ FAIL: tllvm build failed"
            exit 1
          fi
          echo "✅ tllvm built successfully"
          ls -la tllvm
          ./tllvm --version 2>/dev/null || true

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build TLL Runtime (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo === Building TLL Runtime (Windows) ===
          cd tllos\host\c
          cl /O2 /D_CRT_SECURE_NO_WARNINGS /Fe:tllvm.exe main.c vm.c value.c json.c builtin.c sqlite_builtin.c crypto_builtin.c password_builtin.c hmac_builtin.c http_client_builtin.c sqlite3.c ws2_32.lib winhttp.lib bcrypt.lib
          if errorlevel 1 (
            echo ❌ FAIL: tllvm.exe build failed
            exit /b 1
          )
          echo ✅ tllvm.exe built successfully
          dir tllvm.exe

      - name: Verify Runtime exists
        shell: bash
        run: |
          echo "=== Verifying Runtime ==="
          if [ "${{ runner.os }}" = "Windows" ]; then
            TLLVM="tllos/host/c/tllvm.exe"
          else
            TLLVM="tllos/host/c/tllvm"
          fi
          if [ ! -f "$TLLVM" ]; then
            echo "❌ FAIL: Runtime not found at $TLLVM"
            exit 1
          fi
          echo "✅ Runtime found: $TLLVM"
          ls -la "$TLLVM"

      - name: Compile TLL Shop
        shell: bash
        run: |
          echo "=== Compiling mall/main.tll ==="
          if [ "${{ runner.os }}" = "Windows" ]; then
            TLLVM="tllos/host/c/tllvm.exe"
          else
            TLLVM="tllos/host/c/tllvm"
          fi
          TLLC="tllos/${{ env.TLLC_PATH }}"

          # 工具链缺失时必须 FAIL，禁止静默跳过
          if [ ! -f "$TLLVM" ]; then
            echo "❌ FAIL: TLL Runtime not found at $TLLVM"
            exit 1
          fi
          if [ ! -f "$TLLC" ]; then
            echo "❌ FAIL: TLL Compiler not found at $TLLC"
            exit 1
          fi

          echo "Runtime: $TLLVM"
          echo "Compiler: $TLLC"
          echo ""

          "$TLLVM" "$TLLC" compile mall/main.tll -o mall/main.tllbc
          COMPILE_RESULT=$?

          if [ $COMPILE_RESULT -ne 0 ]; then
            echo "❌ FAIL: Compilation failed with exit code $COMPILE_RESULT"
            exit 1
          fi

          if [ ! -f mall/main.tllbc ]; then
            echo "❌ FAIL: Output file mall/main.tllbc not created"
            exit 1
          fi

          echo "✅ Compilation successful"
          ls -la mall/main.tllbc
          echo "Output size: $(wc -c < mall/main.tllbc) bytes"

      - name: Verify source files
        shell: bash
        run: |
          echo "=== Verifying source files ==="
          echo "main.tll: $(wc -l < mall/main.tll) lines"
          echo "core modules: $(ls mall/core/*.tll | wc -l) files"
          echo "user modules: $(ls mall/modules/*.tll | wc -l) files"
          echo ""
          echo "=== Core modules ==="
          ls mall/core/*.tll
          echo ""
          echo "=== User modules ==="
          ls mall/modules/*.tll

      - name: Run P1 Session CSPRNG Test
        shell: bash
        run: |
          echo "=== P1 Session CSPRNG Security Test ==="
          if [ "${{ runner.os }}" = "Windows" ]; then
            TLLVM="tllos/host/c/tllvm.exe"
          else
            TLLVM="tllos/host/c/tllvm"
          fi
          TLLC="tllos/${{ env.TLLC_PATH }}"

          # Compile P1 test
          echo "Compiling P1 test..."
          "$TLLVM" "$TLLC" compile tests/P1-session-csprng-test.tll -o tests/P1-session-csprng-test.tllbc
          TEST_COMPILE_RESULT=$?
          if [ $TEST_COMPILE_RESULT -ne 0 ]; then
            echo "❌ FAIL: P1 test compilation failed"
            exit 1
          fi
          if [ ! -f tests/P1-session-csprng-test.tllbc ]; then
            echo "❌ FAIL: P1 test output not created"
            exit 1
          fi

          # Run P1 test
          echo "Running P1 test..."
          "$TLLVM" tests/P1-session-csprng-test.tllbc
          TEST_RESULT=$?
          echo ""
          echo "P1 test exit code: $TEST_RESULT"
          if [ $TEST_RESULT -ne 0 ]; then
            echo "❌ FAIL: P1 Session CSPRNG test failed"
            exit 1
          fi
          echo "✅ P1 Session CSPRNG test passed"

      - name: Check for SQL injection patterns (informational)
        shell: bash
        run: |
          echo "=== Checking for string concatenation in SQL (informational) ==="
          echo "This is a known issue to be fixed in P1-3 SQL Parameterization"
          grep -rn 'db_query.*+' mall/core/*.tll mall/modules/*.tll | head -20 || echo "No patterns found"
          echo ""
          echo "Count: $(grep -rn 'db_query.*+' mall/core/*.tll mall/modules/*.tll 2>/dev/null | wc -l) occurrences"
          echo ""
          echo "Note: This is informational only, does not fail CI"

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tll-shop-${{ matrix.os }}
          path: |
            mall/main.tllbc
          if-no-files-found: error
